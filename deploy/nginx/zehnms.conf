# nginx site for ZehnMS (Docker deployment). Install it on the VPS with __DOMAIN__ replaced:
#
#   sudo certbot certonly --nginx -d shop.example.com
#   sed "s|__DOMAIN__|shop.example.com|g" deploy/nginx/zehnms.conf | sudo tee /etc/nginx/sites-available/zehnms
#   sudo ln -s /etc/nginx/sites-available/zehnms /etc/nginx/sites-enabled/zehnms
#   sudo nginx -t && sudo systemctl reload nginx
#
# The app container answers on 127.0.0.1:3400 (compose.yaml, ZEHNMS_PORT). It serves /static/
# (WhiteNoise, hashed names, long cache) and /media/ (bank receipts only after a sign-in), so
# nginx simply proxies everything.
#
# Files that must already exist on the host (every other site on the VPS uses them):
#   /etc/letsencrypt/options-ssl-nginx.conf, /etc/letsencrypt/ssl-dhparams.pem   certbot's TLS settings
#   /etc/nginx/snippets/cloudflare-realip.conf    the visitor's address behind Cloudflare
# If the domain is not behind Cloudflare, the snippet is harmless (it trusts Cloudflare's ranges only).

# No query strings or referrers in the access log: password reset and email verification links
# carry their one-time token in the URL.
log_format zehnms_noquery '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent $request_time "$http_user_agent"';

upstream zehnms_app {
    server 127.0.0.1:3400;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    server_tokens off;
    include /etc/nginx/snippets/cloudflare-realip.conf;
    access_log /var/log/nginx/zehnms.access.log zehnms_noquery;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    access_log /var/log/nginx/zehnms.access.log zehnms_noquery;
    error_log  /var/log/nginx/zehnms.error.log warn;

    # In-app backup restores upload a dump file (MAX_BACKUP_UPLOAD_BYTES, 200 MB by default).
    client_max_body_size 210m;
    client_header_timeout 10s;
    client_body_timeout 120s;
    send_timeout 120s;

    # Pages carry session data and CSRF tokens: not compressed (BREACH). Static files arrive
    # pre-compressed from WhiteNoise.
    gzip off;

    location / {
        proxy_pass http://zehnms_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # Overwrite, never append: the app trusts the first address in this header for sign-in
        # lockout, so a client must not be able to supply its own.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 75s;
    }
}
