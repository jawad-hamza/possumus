# nginx site for ZehnMS reached by the server's IP address on its own port, without a domain
# and therefore without https. Temporary: switch to deploy/nginx/zehnms.conf once a domain exists.
#
# Plain http sends passwords and business data unencrypted. Use it for setup and testing, or on
# networks you trust, and move to a domain + https before real use.
#
# Install (replace __PORT__, e.g. 8090; it must be free and allowed through ufw / the provider's
# firewall):
#   sed "s|__PORT__|8090|g" deploy/nginx/zehnms-ip.conf | sudo tee /etc/nginx/sites-available/zehnms
#   sudo ln -s /etc/nginx/sites-available/zehnms /etc/nginx/sites-enabled/zehnms
#   sudo nginx -t && sudo systemctl reload nginx
#
# Port 80 on the IP stays with the server's existing default site; this one listens on __PORT__ only.
# The matching /srv/zehnms/.env settings are in docs/DEPLOYMENT.md, "Without a domain".

log_format zehnms_noquery '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent $request_time "$http_user_agent"';

upstream zehnms_app {
    server 127.0.0.1:3400;
    keepalive 16;
}

server {
    listen __PORT__;
    listen [::]:__PORT__;
    server_name _;
    server_tokens off;

    access_log /var/log/nginx/zehnms.access.log zehnms_noquery;
    error_log  /var/log/nginx/zehnms.error.log warn;

    client_max_body_size 210m;
    client_header_timeout 10s;
    client_body_timeout 120s;
    send_timeout 120s;
    gzip off;

    location / {
        proxy_pass http://zehnms_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # $http_host keeps the port ("203.0.113.5:8090"); Django's CSRF check compares it with
        # the browser's Origin header, which includes the port.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto http;
        # Overwrite, never append: sign-in lockout trusts the first address in this header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 75s;
    }
}
