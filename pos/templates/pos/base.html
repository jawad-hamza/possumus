{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}POS System{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            overflow-x: hidden;
        }

        .sidebar {
            width: 240px;
            height: 100vh;
            position: fixed;
            background: #111827; /* dark professional */
            color: #fff;
        }

        .sidebar a {
            color: #cbd5e1;
            text-decoration: none;
            display: block;
            padding: 12px 20px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #1f2933;
            color: #fff;
        }

        .content {
            margin-left: 240px;
            padding: 24px;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h5 class="text-center py-4 border-bottom">🧾 POS IMS</h5>

    <a href="{% url 'dashboard' %}">
        <i class="bi bi-speedometer2 me-2"></i> Dashboard
    </a>

    <a href="{% url 'pos_screen' %}">
        <i class="bi bi-cart me-2"></i> POS
    </a>

    <a href="{% url 'product_list' %}">
        <i class="bi bi-box-seam me-2"></i> Products
    </a>

    <a href="{% url 'daily_sales_report' %}">
        <i class="bi bi-bar-chart me-2"></i> Reports
    </a>
</div>

<!-- MAIN CONTENT -->
<div class="content">
    {% block content %}
    {% endblock %}
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

{% block extra_js %}{% endblock %}
</body>
</html>
