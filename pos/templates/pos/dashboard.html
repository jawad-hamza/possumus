{% extends "pos/base.html" %}
{% block title %}Dashboard{% endblock %}

{% block content %}
<h3 class="mb-4">Dashboard</h3>

<div class="row g-3">

    <!-- Total Sales -->
    <div class="col-md-3">
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-muted">Today Sales</h6>
                        <h4 class="fw-bold">Rs {{ total_sales_amount }}</h4>
                    </div>
                    <i class="bi bi-cash-stack fs-2 text-success"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Total Bills -->
    <div class="col-md-3">
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-muted">Bills Today</h6>
                        <h4 class="fw-bold">{{ total_bills }}</h4>
                    </div>
                    <i class="bi bi-receipt fs-2 text-primary"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Low Stock -->
    <div class="col-md-3">
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-muted">Low Stock Items</h6>
                        <h4 class="fw-bold">{{ low_stock_count }}</h4>
                    </div>
                    <i class="bi bi-exclamation-triangle fs-2 text-warning"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- Customers -->
    <div class="col-md-3">
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-muted">Active Customers</h6>
                        <h4 class="fw-bold">{{ customer_count }}</h4>
                    </div>
                    <i class="bi bi-people fs-2 text-info"></i>
                </div>
            </div>
        </div>
    </div>

</div>
{% endblock %}
