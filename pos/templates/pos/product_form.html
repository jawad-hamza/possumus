{% extends "pos/base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<h3 class="mb-4">{{ title }}</h3>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <div class="mt-3">
        <button class="btn btn-success">Save</button>
        <a href="{% url 'product_list' %}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
