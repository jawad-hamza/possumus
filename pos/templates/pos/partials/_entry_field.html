<div class="st-field k-form-field{% if field.errors %} st-field--error{% endif %}">
    {% if field.field.widget.input_type == 'checkbox' %}
    <div class="form-check form-switch">
        {{ field }}
        <label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.help_text %}{% include "pos/partials/_help_tip.html" with tip_id=field.auto_id|add:"_helptext" tip_name=field.label tip_text=field.help_text %}{% endif %}</label>
    </div>
    {% else %}
    <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}{% if field.field.required %}<span class="st-req" title="Required">*</span>{% endif %}{% if field.help_text %}{% include "pos/partials/_help_tip.html" with tip_id=field.auto_id|add:"_helptext" tip_name=field.label tip_text=field.help_text %}{% endif %}</label>
    {{ field }}
    {% endif %}
    {% if field.errors %}
    <div class="k-error"><i class="bi bi-exclamation-circle" aria-hidden="true"></i>{{ field.errors|join:', ' }}</div>
    {% endif %}
</div>
