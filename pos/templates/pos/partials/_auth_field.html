<div class="k-auth-field k-auth-field--{{ field.name }}">
    <label class="form-label" for="{{ field.id_for_label }}">{{ label|default:field.label }}{% if field.help_text %}<span class="k-tip"><button type="button" class="k-tip-btn" aria-label="About {{ label|default:field.label }}" aria-describedby="{{ field.auto_id }}_helptext" aria-expanded="false"><i class="bi bi-info-circle" aria-hidden="true"></i></button><span class="k-tip-body" id="{{ field.auto_id }}_helptext" role="tooltip" hidden>{% if help_safe %}{{ field.help_text|safe }}{% else %}{{ field.help_text }}{% endif %}</span></span>{% endif %}</label>
    {{ field }}
    {% if field.errors %}<div class="k-error"><i class="bi bi-exclamation-circle" aria-hidden="true"></i>{{ field.errors|striptags }}</div>{% endif %}
</div>
