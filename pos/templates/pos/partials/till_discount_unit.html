{% load currency_tags %}{% currency_symbol as discount_symbol %}<span class="t-unit-switch" role="radiogroup" aria-label="Bill discount given as"><label class="t-unit-opt" data-tip="Take a percentage off the bill. Type % after the figure, or press F6 again to flip"><input type="radio" name="discount_type" value="percent" id="discount_type_percent" aria-label="Percentage"{% if not bill_discount.is_amount %} checked{% endif %}><span aria-hidden="true">%</span></label><label class="t-unit-opt" data-tip="Take a cash amount off the bill. Type R after the figure, or press F6 again to flip"><input type="radio" name="discount_type" value="amount" id="discount_type_amount" aria-label="Cash amount"{% if bill_discount.is_amount %} checked{% endif %}><span aria-hidden="true">{{ discount_symbol|default:"Cash" }}</span></label></span>
