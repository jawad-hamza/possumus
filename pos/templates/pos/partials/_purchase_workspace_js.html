<script>
(function () {
    const totalFormsInput = document.getElementById('id_items-TOTAL_FORMS');
    const lineTemplate = document.getElementById('purchaseLineTemplate');
    const lineBody = document.getElementById('purchaseLinesBody');
    const addLineButton = document.getElementById('addPurchaseLineBtn');

    function bindRemoveButton(row) {
        const removeButton = row.querySelector('[data-remove-line]');
        if (!removeButton) {
            return;
        }
        removeButton.addEventListener('click', function () {
            const deleteInput = row.querySelector('input[type="checkbox"][name$="-DELETE"]');
            if (deleteInput) {
                deleteInput.checked = true;
            }
            row.classList.add('d-none');
        });
    }

    function addPurchaseLine() {
        if (!totalFormsInput || !lineTemplate || !lineBody) {
            return null;
        }

        const formIndex = Number(totalFormsInput.value);
        const markup = lineTemplate.innerHTML.replaceAll('__prefix__', String(formIndex));
        const wrapper = document.createElement('tbody');
        wrapper.innerHTML = markup.trim();
        const row = wrapper.querySelector('tr');
        if (!row) {
            return null;
        }

        lineBody.appendChild(row);
        totalFormsInput.value = String(formIndex + 1);
        bindRemoveButton(row);
        return row;
    }

    function appendOption(select, value, label, selected) {
        if (!select) {
            return;
        }

        const stringValue = String(value);
        let option = Array.from(select.options).find((item) => item.value === stringValue);
        if (!option) {
            option = document.createElement('option');
            option.value = stringValue;
            option.textContent = label;
            select.appendChild(option);
        } else {
            option.textContent = label;
        }

        if (selected) {
            select.value = stringValue;
        }
    }

    function visibleProductSelects() {
        return Array.from(document.querySelectorAll('select[name$="-product"]')).filter(
            (select) => !select.closest('tr')?.classList.contains('d-none')
        );
    }

    function assignProductToPurchaseLine(product) {
        let targetSelect = visibleProductSelects().find((select) => !select.value);
        if (!targetSelect) {
            const newRow = addPurchaseLine();
            targetSelect = newRow ? newRow.querySelector('select[name$="-product"]') : null;
        }
        if (!targetSelect) {
            return;
        }

        appendOption(targetSelect, product.id, `${product.name} (${product.sku})`, true);
        const saleInput = targetSelect.closest('tr')?.querySelector('input[name$="-sale_price"]');
        if (saleInput && !saleInput.value) {
            saleInput.value = product.price;
        }
    }

    function setFeedback(form, messages, tone) {
        const feedback = form.querySelector('[data-form-feedback]');
        if (!feedback) {
            return;
        }

        if (!messages || messages.length === 0) {
            feedback.classList.add('d-none');
            feedback.textContent = '';
            feedback.className = 'small mt-2 d-none';
            return;
        }

        feedback.className = `small mt-2 ${tone === 'success' ? 'text-success' : 'text-danger'}`;
        feedback.classList.remove('d-none');
        feedback.innerHTML = messages.join('<br>');
    }

    function flattenErrors(errorMap) {
        const messages = [];
        Object.keys(errorMap || {}).forEach((key) => {
            (errorMap[key] || []).forEach((message) => messages.push(message));
        });
        return messages;
    }

    async function submitQuickForm(form) {
        const response = await fetch(form.action, {
            method: 'POST',
            body: new FormData(form),
            headers: {
                'X-Requested-With': 'XMLHttpRequest',
            },
        });

        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
            setFeedback(form, flattenErrors(payload.errors || {}), 'error');
            return;
        }

        const kind = form.dataset.kind;
        if (kind === 'brand') {
            appendOption(document.getElementById('{{ quick_product_form.brand.id_for_label }}'), payload.brand.id, payload.brand.name, true);
            setFeedback(form, [`Brand "${payload.brand.name}" is ready for product creation.`], 'success');
        }

        if (kind === 'category') {
            appendOption(document.getElementById('{{ quick_product_form.category.id_for_label }}'), payload.category.id, payload.category.name, true);
            setFeedback(form, [`Category "${payload.category.name}" is ready for product creation.`], 'success');
        }

        if (kind === 'supplier') {
            appendOption(document.getElementById('{{ purchase_form.supplier.id_for_label }}'), payload.supplier.id, payload.supplier.name, true);
            appendOption(document.getElementById('{{ quick_product_form.supplier.id_for_label }}'), payload.supplier.id, payload.supplier.name, true);
            setFeedback(form, [`Supplier "${payload.supplier.name}" has been selected on this purchase.`], 'success');
        }

        if (kind === 'product') {
            document.querySelectorAll('select[name$="-product"]').forEach((select) => {
                appendOption(select, payload.product.id, `${payload.product.name} (${payload.product.sku})`, false);
            });
            assignProductToPurchaseLine(payload.product);
            setFeedback(form, [`Product "${payload.product.name}" is now available in the purchase lines.`], 'success');
        }

        form.reset();
    }

    document.querySelectorAll('.purchase-line-row').forEach(bindRemoveButton);
    if (addLineButton) {
        addLineButton.addEventListener('click', addPurchaseLine);
    }

    document.querySelectorAll('.quick-create-form').forEach((form) => {
        form.addEventListener('submit', function (event) {
            event.preventDefault();
            submitQuickForm(form);
        });
    });
})();
</script>
