{% extends "pos/base.html" %}

{% block title %}Party Statement{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="mb-1">Party Statement</h2>
        <p class="text-muted mb-0">Inspect customer, supplier, or combined statements with opening and closing balances.</p>
    </div>
</div>

<div class="page-card p-4">
    <div class="row g-3 mb-4">
        <div class="col-md-3"><input type="number" id="customer_id" class="form-control" placeholder="Customer ID"></div>
        <div class="col-md-3"><input type="number" id="supplier_id" class="form-control" placeholder="Supplier ID"></div>
        <div class="col-md-2"><input type="date" id="from_date" class="form-control"></div>
        <div class="col-md-2"><input type="date" id="to_date" class="form-control"></div>
        <div class="col-md-2 d-grid"><button class="btn btn-dark" onclick="loadStatement()">Load</button></div>
    </div>

    <div id="summary" class="mb-4"></div>

    <div class="table-responsive">
        <table class="table table-sm align-middle mb-0" id="table" style="display:none;">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Voucher</th>
                    <th>Ref</th>
                    <th class="text-end">Debit</th>
                    <th class="text-end">Credit</th>
                    <th class="text-end">Balance</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function loadStatement() {
    const customer = document.getElementById('customer_id').value;
    const supplier = document.getElementById('supplier_id').value;
    const from = document.getElementById('from_date').value;
    const to = document.getElementById('to_date').value;

    let url = '/api/party-statement/?';
    if (customer) url += `customer_id=${customer}&`;
    if (supplier) url += `supplier_id=${supplier}&`;
    if (from) url += `from=${from}&`;
    if (to) url += `to=${to}&`;

    fetch(url)
        .then(response => response.json())
        .then(renderStatement);
}

function renderStatement(data) {
    const summary = document.getElementById('summary');
    const table = document.getElementById('table');
    const body = table.querySelector('tbody');

    body.innerHTML = '';
    table.style.display = 'table';

    summary.innerHTML = `
        <div class="d-flex flex-wrap gap-3 align-items-center">
            <div><strong>Party:</strong> ${data.party}</div>
            <div><strong>Opening:</strong> ${data.opening_balance}</div>
            <div><strong>Closing:</strong> ${data.closing_balance}</div>
            <span class="status-chip ${data.balance_type}">${data.balance_type.toUpperCase()}</span>
        </div>
    `;

    data.rows.forEach(row => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${row.date}</td>
            <td>${row.voucher_type} #${row.voucher_id}</td>
            <td>${row.ref}</td>
            <td class="text-end">${row.debit}</td>
            <td class="text-end">${row.credit}</td>
            <td class="text-end">${row.display_balance}</td>
        `;
        body.appendChild(tr);
    });
}
</script>
{% endblock %}
