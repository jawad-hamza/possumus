<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt #1</title>
    <style>
        @page {
            size: 50mm auto;
            margin: 0;
        }

        body {
            margin: 0;
            background: #e5e7eb;
            color: #111827;
            font-family: "Courier New", Courier, monospace;
        }

        .screen-actions {
            max-width: 380px;
            margin: 18px auto 0;
            padding: 0 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .screen-actions a,
        .screen-actions button {
            border: 1px solid #111827;
            background: #ffffff;
            color: #111827;
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .screen-actions .primary {
            background: #111827;
            color: #ffffff;
        }

        .receipt-stage {
            padding: 16px 0 32px;
        }

        .receipt {
            width: 50mm;
            min-width: 50mm;
            max-width: 50mm;
            margin: 0 auto;
            background: #ffffff;
            padding: 2.5mm 2.2mm 3mm;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.16);
            box-sizing: border-box;
        }

        .receipt-center {
            text-align: center;
        }

        .receipt img {
            max-width: 18mm;
            max-height: 18mm;
            object-fit: contain;
            margin-bottom: 4px;
        }

        .company-name {
            font-size: 12px;
            font-weight: 700;
            line-height: 1.25;
        }

        .company-copy,
        .footer {
            font-size: 9px;
            line-height: 1.35;
            word-break: break-word;
        }

        .divider {
            border-top: 1px dashed #94a3b8;
            margin: 6px 0;
        }

        .meta-row,
        .item-pricing,
        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            font-size: 9px;
        }

        .meta-row strong,
        .item-pricing strong,
        .summary-row strong {
            font-weight: 700;
        }

        .meta-block {
            display: grid;
            gap: 4px;
        }

        .line-item {
            padding: 5px 0;
        }

        .item-name {
            font-size: 10px;
            font-weight: 700;
            line-height: 1.3;
            word-break: break-word;
            margin-bottom: 2px;
        }

        .badge-strip {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 4px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            border: 1px solid #cbd5e1;
            border-radius: 999px;
            padding: 2px 6px;
            font-size: 8px;
            background: #f8fafc;
        }

        .summary-row {
            padding: 2px 0;
        }

        .summary-row.total {
            font-size: 11px;
            font-weight: 700;
            padding-top: 6px;
        }

        .footer {
            text-align: center;
            margin-top: 8px;
            color: #475569;
        }

        @media print {
            body {
                background: #ffffff;
            }

            .screen-actions {
                display: none !important;
            }

            .receipt-stage {
                padding: 0;
            }

            .receipt {
                box-shadow: none;
                margin: 0;
            }
        }
    </style>
</head>
<body>
<div class="screen-actions">
    <button class="primary" onclick="window.print()">Print 50mm</button>
    <a href="/invoice/1/pdf/">Download 50mm PDF</a>
    <a href="/invoice/1/return/">Return Items</a>
    <a href="/pos/">Back to POS</a>
</div>

<div class="receipt-stage">
    <div class="receipt">
        <div class="receipt-center">
            
            <div class="company-name">POS IMS</div>
            
            
            
        </div>

        <div class="divider"></div>

        <div class="meta-block">
            <div class="meta-row"><span>Receipt</span><strong>#1</strong></div>
            <div class="meta-row"><span>Date</span><strong>07 Mar 2026</strong></div>
            <div class="meta-row"><span>Time</span><strong>17:46</strong></div>
            <div class="meta-row"><span>Payment</span><strong>Cash</strong></div>
            <div class="meta-row"><span>Customer</span><strong>Walk-in</strong></div>
            
            
        </div>

        <div class="divider"></div>

        
        <div class="line-item">
            <div class="item-name">bun</div>
            <div class="item-pricing">
                <span>1 x Rs 10.00</span>
                <strong>Rs 10.00</strong>
            </div>
            
            <div class="badge-strip">
                <span class="badge">Custom price</span>
                
            </div>
            
        </div>
        

        <div class="divider"></div>

        <div class="summary-row"><span>Line Subtotal</span><strong>Rs 10.00</strong></div>
        
        
        
        <div class="summary-row total"><span>Total</span><strong>Rs 10.00</strong></div>
        <div class="summary-row"><span>Paid</span><strong>Rs 10.00</strong></div>
        <div class="summary-row"><span>Balance</span><strong>Rs 0.00</strong></div>
        

        <div class="divider"></div>
        <div class="footer">Thank you for your business.</div>
    </div>
</div>
</body>
</html>
